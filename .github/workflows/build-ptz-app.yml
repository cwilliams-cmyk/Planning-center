name: Build Astra PTZ Control (macOS app)

on:
  push:
    branches:
      - claude/ptz-camera-control-app-3tjljy
      - main
    paths:
      - "ptz-control/**"
      - ".github/workflows/build-ptz-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14 # Apple Silicon runner
            arch: arm64
            label: apple-silicon
          - os: macos-13 # Intel runner
            arch: x64
            label: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ptz-control
        run: npm install

      - name: Build app
        working-directory: ptz-control
        env:
          # No Apple Developer certificate: skip signing (electron-builder
          # ad-hoc signs, which is enough to run after right-click > Open).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Rename artifacts by architecture
        working-directory: ptz-control/dist
        run: |
          for f in *.dmg *.zip; do
            [ -e "$f" ] || continue
            mv "$f" "$(basename "$f" | sed "s/\.\(dmg\|zip\)$/-${{ matrix.label }}.\1/")"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: astra-ptz-control-${{ matrix.label }}
          path: |
            ptz-control/dist/*.dmg
            ptz-control/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ptz-control-latest
          name: OrZ Control (latest build)
          body: |
            OrZ Control - production desktop app for Hollyland Astra PTZ cameras.

            **Which file do I download?**
            - Mac with Apple Silicon (M1/M2/M3/M4, 2020 or newer): `*-apple-silicon.dmg`
            - Older Intel Mac: `*-intel.dmg`

            **Install:** open the `.dmg`, drag **OrZ Control** into
            **Applications**. The app is not notarized with Apple, so the
            first launch needs one extra step: **right-click the app →
            Open → Open**. If macOS still refuses ("damaged" or no Open
            button), run this once in Terminal and try again:
            `xattr -cr "/Applications/OrZ Control.app"`

            It opens like any other app and needs no browser, Terminal,
            Node, or ffmpeg. It starts in Live Control mode (safe,
            control-only); switch to Setup mode before service to scan for
            cameras and edit presets.
          files: dist/*
          prerelease: false
